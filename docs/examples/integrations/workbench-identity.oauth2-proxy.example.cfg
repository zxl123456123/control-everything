# Generic OIDC provider: endpoints come from <issuer>/.well-known/openid-configuration.
provider = "oidc"
oidc_issuer_url = "https://identity.example.test/realms/workbench"
# End the identity session as well as the proxy cookie. Use the end_session_endpoint advertised by
# <oidc_issuer_url>/.well-known/openid-configuration (for Keycloak it ends in /protocol/openid-connect/logout).
backend_logout_url = "https://identity.example.test/realms/workbench/protocol/openid-connect/logout?client_id=workbench-web&id_token_hint={id_token}"
client_id = "workbench-web"
# Set client_secret and cookie_secret in a private configuration file.
redirect_url = "https://workbench.example.test/oauth2/callback"
http_address = "127.0.0.1:18868"
upstreams = ["static://202"]
email_domains = ["*"]
user_id_claim = "sub"
prefer_email_to_user = false
set_xauthrequest = true
pass_access_token = true
pass_user_headers = false
pass_authorization_header = false
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_refresh = "30s"
cookie_expire = "30m"
skip_provider_button = true
reverse_proxy = true
scope = "openid profile email"
