# Separate daemon: /usr/sbin/sshd -D -f /etc/ce-device-sshd.conf
# Never install this file as /etc/ssh/sshd_config or change the existing port 22 daemon.
Port 2223
# AddressFamily inet keeps the default listener on all IPv4 addresses.
AddressFamily inet
PidFile /run/ce-device-sshd.pid
HostKey /etc/ce-device-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /var/lib/ce-device-ssh/keys/%u
StrictModes yes
AllowUsers ced_*
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
UsePAM yes
AllowTcpForwarding remote
GatewayPorts no
PermitOpen none
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
PermitTTY no
MaxSessions 0
ForceCommand /usr/sbin/nologin
PermitUserEnvironment no
PermitUserRC no
ClientAliveInterval 15
ClientAliveCountMax 2
LoginGraceTime 30
LogLevel INFO
# Each root-owned authorized key includes exactly two permitlisten entries.
