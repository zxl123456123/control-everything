<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人工进度 · Control Everything</title>
  <script src="/ui-theme.js" data-ce-theme-key="ce.progress.theme"></script>
  <link rel="stylesheet" href="/progress.css">
  <script src="/news.js" defer></script>
  <script src="/progress.js" defer></script>
</head>
<body>
  <div class="desk">
    <header class="topbar">
      <div>
        <p class="date" id="progress-date"></p>
        <h1>人工进度</h1>
      </div>
      <nav aria-label="页面入口"><a class="back" href="/studio">项目总览</a><a class="back" href="/sessions">会话观察</a><button id="progress-theme" type="button" aria-label="切换到深色主题"></button></nav>
    </header>
    <p id="progress-theme-error" class="theme-error" role="status" aria-live="polite" hidden></p>
    <div class="zones">
      <section class="zone zone-projects">
        <header><h2>项目进度</h2></header>
        <p id="progress-status" class="status" role="status"></p>
        <div id="progress-board" class="glance"></div>
        <div id="progress-stage"></div>
      </section>
      <section class="zone zone-news">
        <header><h2>Hacker News</h2><p>既有前页来源，非AI筛选；HN收录不代表文章出版。</p></header>
        <p id="legacy-news-status" role="status"></p><div id="legacy-news-sources"></div>
        <div id="news-zone"></div>
      </section>
      <section class="zone zone-todos">
        <header><h2>待办</h2></header>
        <div id="todo-zone"></div>
      </section>
      <section class="zone zone-launch">
        <header id="launch-heading"><h2>启动器</h2><p>按用途选择已配置入口。</p></header>
        <div id="launch-zone" class="groups"></div>
      </section>
    </div>
  </div>
</body>
</html>
