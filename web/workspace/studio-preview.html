  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/project-progress.css">

  <link rel="stylesheet" href="/studio-preview.css">
  <link rel="stylesheet" href="/remote/remote-account.css">
  <script defer src="/ui-dialog.js"></script>
  <script defer src="/onboarding.js"></script>

  <script defer src="/monitor-scene.js"></script>

  <script defer src="/project-progress.js"></script>
  <script defer src="/agents.js"></script>
  <script defer src="/studio-data.js"></script>
  <script defer src="/remote/account-device.js"></script>
  <script defer src="/mobile-device-entry.js"></script>
  <script defer src="/news-pets.js"></script>
  <script defer src="/news-pet-dial.js"></script>
  <script defer src="/news-pet-prefs.js"></script>
  <script defer src="/news-pet-director.js"></script>
  <script defer src="/news-pet-status.js"></script>
  <script defer src="/studio-shell.js"></script>
  <script defer src="/studio-pet-settings.js"></script>
  <script defer src="/studio-mascot.js"></script>

</head>
<body>
  <section id="ce-studio" data-theme="light" aria-label="Control Everything 工作台">
    <div class="ce-shell">
      <aside id="studio-rail" class="ce-rail" aria-label="应用导航"></aside>
      <div class="ce-app">
        <div id="studio-topbar"></div>
        <p id="studio-status" class="ce-preview-notice" role="status" aria-live="polite">正在读取本地工作台…</p>
        <p id="studio-theme-status" class="ce-preview-notice" role="status" hidden></p>
        <main class="ce-content" aria-label="工作区">
          <div id="studio-content" class="ce-main"></div>
          <section id="studio-tasks" class="ce-business-module ce-main" aria-label="事项管理" hidden></section>
          <section id="studio-legacy-board" class="ce-business-module ce-main" aria-label="事项看板" hidden></section>
          <section id="studio-agent-board" class="ce-business-module ce-main" aria-label="任务进度与人工审核" hidden></section>
          <section id="studio-monitor" class="ce-business-module ce-main" aria-label="项目协作监控" hidden><div id="studio-monitor-content"></div></section>
        </main>
      </div>
    </div>
  </section>
</body>
</html>
