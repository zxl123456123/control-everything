<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的电脑</title><link rel="stylesheet" href="/remote/remote-account.css"><script src="/remote/remote-account.js" defer></script></head><body><main><h1>我的电脑</h1><p id="account"></p><p id="status" role="status">正在读取账号…</p><p id="login"><a href="/oauth2/start?rd=%2Fremote">登录 / 注册账号</a></p><form id="activation" hidden><label>小组邀请码<input name="invite" required autocomplete="off"></label><button>激活小组接入</button></form><section id="invitations" class="invitation" hidden><h2>邀请小组成员</h2><button id="create-invitation" type="button">生成邀请码</button><p>邀请码有效 24 小时，只能使用一次。请自行交给需要接入的成员。</p><p id="invitation-result" hidden><span>本次邀请码：</span><output id="invitation-code" aria-live="polite"></output></p></section><section id="device" hidden><h2 id="device-name"></h2><p id="device-state"></p><a id="open" class="primary-action" href="/studio">打开我的工作台</a><div class="secondary-action"><button id="revoke" type="button">撤销电脑连接</button><p>撤销只断开远程连接，不会删除本机项目。</p></div></section><p>在 Windows 软件中打开“绑定这台电脑”，登录后核对账号并确认。iPhone 与 Android 使用本网站；当前未提供原生安装包。</p><button id="logout" type="button" hidden>退出账号</button></main></body></html>
