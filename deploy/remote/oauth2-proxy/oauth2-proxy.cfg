# 与 IdP 无关的 oauth2-proxy 公共设置，来自 docs/examples/integrations/workbench-identity.oauth2-proxy.example.cfg。
# provider、issuer、client id/secret、cookie secret、redirect_url、backend_logout_url 与监听地址
# 由 OAUTH2_PROXY_* 环境变量提供（见 docker-compose.yml 与 ce-remote.env.example）。
upstreams = ["static://202"]
email_domains = ["*"]
user_id_claim = "sub"
prefer_email_to_user = false
set_xauthrequest = true
pass_access_token = true
pass_user_headers = false
pass_authorization_header = false
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_refresh = "30s"
cookie_expire = "30m"
skip_provider_button = true
reverse_proxy = true
scope = "openid profile email"
